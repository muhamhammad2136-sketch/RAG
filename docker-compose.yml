services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/rag?schema=public}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      REDIS_URL: ${REDIS_URL}
      MONGO_URI: ${MONGO_URI:-}
    volumes:
      - ./uploads:/app/uploads